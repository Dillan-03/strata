name: Screenshots

# Captures the README screenshots from the real app and publishes them to an orphan branch, so they always match main
# without committing images to its history. It doesn't run on pull requests, to save macOS runners.
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  capture:
    name: Capture screenshots
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Run the capture test
        env:
          TEST_RUNNER_STRATA_SCREENSHOTS: "1"
        run: |
          set -o pipefail
          (cd App && xcodegen generate --quiet)
          xcodebuild test -project App/Strata.xcodeproj -scheme Strata -destination 'platform=macOS' \
            -only-testing:StrataUITests/ScreenshotTests -resultBundlePath build/Screenshots.xcresult -quiet

      - name: Report test results
        if: always()
        run: |
          if [ -d build/Screenshots.xcresult ]; then
            python3 .github/scripts/xcresult-report.py build/Screenshots.xcresult "Screenshot test"
          fi

      - name: Extract screenshots
        run: |
          xcrun xcresulttool export attachments --path build/Screenshots.xcresult --output-path build/attachments
          mkdir -p build/screenshots
          python3 - <<'EOF'
          import json, pathlib, shutil, sys
          source = pathlib.Path("build/attachments")
          manifest = json.loads((source / "manifest.json").read_text())
          wanted = {"overview", "issues", "inspector", "fix-review", "mcp", "changes", "review", "review-settings", "review-prompt"}
          found = {}
          for test in manifest:
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "")
                  for screen in wanted:
                      if name == f"{screen}.png" or name.startswith(f"{screen}_"):
                          found[screen] = source / attachment["exportedFileName"]
          missing = sorted(wanted - found.keys())
          if missing:
              print(f"::error title=Screenshots::Missing {', '.join(missing)}. Manifest: {json.dumps(manifest)[:1500]}")
              sys.exit(1)
          for screen, path in found.items():
              shutil.copy(path, f"build/screenshots/{screen}.png")
          print("::notice title=Screenshots::Captured " + ", ".join(sorted(found)))
          EOF

      # A manual run on another branch keeps its screenshots as an artifact, so unmerged UI never replaces the README's.
      - name: Keep screenshots from a branch
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.sha }}
          path: build/screenshots
          retention-days: 14

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: screenshots
        run: |
          cd build/screenshots
          printf 'Generated by the Screenshots workflow from %s. Do not edit; this branch is replaced on every run.\n' "$GITHUB_SHA" > README.md
          git init -q -b "$BRANCH"
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots from $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "::notice title=Screenshots published::$BRANCH at $(git rev-parse --short HEAD) from $GITHUB_SHA"
