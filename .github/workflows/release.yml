name: Release

on:
  # Every push to main is checked. One that leaves entries under Unreleased releases the version they call for.
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (must match MARKETING_VERSION)"
        required: true
      publish:
        description: "Publish v<version> from this commit on main, creating the tag (otherwise a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what this run does
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main --tags
          declared=$(grep -E '^\s+MARKETING_VERSION:' App/project.yml | head -1 | awk '{print $2}')
          run=true
          bump=false
          case "$GITHUB_EVENT_NAME" in
            push)
              status=0
              version=$(scripts/next-version.py) || status=$?
              if [ "$status" -eq 0 ]; then
                bump=true
                publish=true
                echo "::notice title=Release::Unreleased calls for $version, so this push commits that version and releases it."
              elif [ "$status" -eq 3 ]; then
                # An unreleased MARKETING_VERSION means a run failed after committing its version, so release it now.
                version="$declared"
                if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  run=false
                  publish=false
                  echo "::notice title=Release::Unreleased is empty and v$version is released, so this push doesn't release anything."
                else
                  publish=true
                  echo "::notice title=Release::v$version isn't released yet, so this push releases it."
                fi
              else
                echo "$version"
                exit 1
              fi
              ;;
            workflow_dispatch) version="$INPUT_VERSION"; publish="$INPUT_PUBLISH" ;;
            *) version="$declared"; publish=false ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'"
            exit 1
          fi
          if [ "$bump" = "false" ] && [ "$declared" != "$version" ]; then
            echo "::error::App/project.yml declares MARKETING_VERSION $declared, not $version"
            exit 1
          fi
          if [ "$publish" = "true" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_SHA isn't on main. Only merged commits are released."
              exit 1
            fi
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::v$version is already published."
              exit 1
            fi
            # A tag without a release is left over from a failed run. Stop rather than skip, or the release never ships.
            tagged=$(git rev-list -n 1 "refs/tags/v$version" 2>/dev/null || true)
            if [ -n "$tagged" ] && { [ "$bump" = "true" ] || [ "$tagged" != "$GITHUB_SHA" ]; }; then
              echo "::error::v$version is tagged on $tagged but has no release. Delete the tag with 'git push origin :refs/tags/v$version', then re-run."
              exit 1
            fi
            # The Commit version job checks a bumped version once it has moved the changelog.
            if [ "$bump" = "false" ]; then
              scripts/next-version.py --check "$version"
            fi
          fi
          {
            echo "run=$run"
            echo "version=$version"
            echo "publish=$publish"
            echo "bump=$bump"
          } >> "$GITHUB_OUTPUT"

  # A release is built only from a commit that passes all of CI. A pull request skips this: its own CI run covers it.
  ci:
    name: CI
    needs: plan
    if: needs.plan.outputs.run == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Commits the version the changelog calls for, so nobody opens a pull request to bump it.
  # RELEASE_DEPLOY_KEY is a write deploy key that the main ruleset lets bypass pull requests.
  bump:
    name: Commit version
    needs: [plan, ci]
    if: needs.plan.outputs.bump == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          previous=$(grep -E '^\s+MARKETING_VERSION:' App/project.yml | head -1 | awk '{print $2}')
          build=$(grep -E '^\s+CURRENT_PROJECT_VERSION:' App/project.yml | head -1 | awk '{print $2}')
          sed -i -E "s/^(\s+MARKETING_VERSION:).*/\1 $VERSION/; s/^(\s+CURRENT_PROJECT_VERSION:).*/\1 $((build + 1))/" App/project.yml
          # A heading under Unreleased takes all of its entries, and the new version gets a link like the others.
          sed -i -e "s/^## \[Unreleased\]$/&\n\n## [$VERSION] - $(date -u +%F)/" \
            -e "s|^\[$previous\]: |[$VERSION]: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION\n&|" CHANGELOG.md
          scripts/next-version.py --check "$VERSION"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: CI already passed on the merged commit, and this one only changes version numbers.
          git commit -qam "[Chore] Release $VERSION [skip ci]"
          # ponytail: a merge landing since this run started makes the push fail. The run for that newer push releases
          # everything, so this run's red X is the only cost. Rebase here if that ever gets common.
          if ! git push origin HEAD:main; then
            echo "::error title=Commit version::Push to main refused. Either main moved on since $GITHUB_SHA, and the newer push's run releases these entries, or RELEASE_DEPLOY_KEY is missing or can't bypass the ruleset (docs/release-process.md#deploy-key)."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Commit version::Pushed $VERSION to main as $(git rev-parse --short HEAD)"

  build:
    name: Build and sign
    needs: [plan, ci, bump]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.bump.result != 'failure' && (needs.ci.result == 'success' || (github.event_name == 'pull_request' && needs.ci.result == 'skipped')) }}
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        id: xcodegen
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Build Release
        id: build
        run: scripts/build-release.sh

      - name: Sign and notarise
        id: sign
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: scripts/sign-and-notarize.sh

      - name: Package
        id: package
        run: |
          scripts/package-release.sh "${{ needs.plan.outputs.version }}"
          cp build/Release/signing-status dist/signing-status

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # Step logs can't be read through the checks API, so name the failed step in an annotation.
      - name: Report failed step
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "$STEPS" | python3 -c '
          import json, sys
          for name, step in json.load(sys.stdin).items():
              if step["outcome"] == "failure":
                  print(f"::error title=Release step failed::{name}")
          '

  verify:
    name: Verify install (${{ matrix.os }})
    needs: [plan, build]
    # Explicit, because a skipped CI job upstream would otherwise skip this on pull requests.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest hosted macOS images: 15 is the app's minimum.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Checksum and signature
        run: |
          (cd dist && shasum -a 256 -c "Strata-$VERSION.zip.sha256")
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k "dist/Strata-$VERSION.zip" "$RUNNER_TEMP/app"
          codesign --verify --deep --strict "$RUNNER_TEMP/app/Strata.app"
          if [ "$(cat dist/signing-status)" = "signed" ]; then
            spctl --assess --type execute "$RUNNER_TEMP/app/Strata.app"
            echo "::notice title=Gatekeeper ($(sw_vers -productVersion))::Signed and notarised build accepted"
          fi
          echo "::notice title=Verified on macOS $(sw_vers -productVersion)::Checksum matches; codesign --verify --strict passed ($(cat dist/signing-status) build)"

      - name: Launch
        run: scripts/smoke-test-app.sh "$RUNNER_TEMP/app/Strata.app"

      - name: Homebrew install, uninstall, reinstall and zap
        run: scripts/cask-smoke-test.sh "$VERSION" "dist/Strata-$VERSION.zip"

  publish:
    name: Publish release
    needs: [plan, build, verify]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      # main, not the released commit: the cask commit goes on top of whatever main is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(cat dist/signing-status)
          sha=$(awk '{print $1}' "dist/Strata-$VERSION.zip.sha256")
          {
            if [ "$status" = "signed" ]; then
              echo "Signed with a Developer ID certificate and notarised by Apple."
            else
              echo "> [!WARNING]"
              echo "> **Unsigned build.** This release is ad-hoc signed and not notarised, so macOS Gatekeeper blocks it at first launch. After installing, run \`xattr -dr com.apple.quarantine /Applications/Strata.app\`, or right-click Strata in Finder and choose Open."
            fi
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "brew tap dillan-03/strata https://github.com/Dillan-03/strata"
            echo "brew install --cask dillan-03/strata/strata-inspector"
            echo '```'
            echo
            echo "SHA-256 of \`Strata-$VERSION.zip\`: \`$sha\`"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [ "$status" != "signed" ]; then prerelease=(--prerelease); fi
          # Creates the v$VERSION tag on the released commit.
          gh release create "v$VERSION" "dist/Strata-$VERSION.zip" "dist/Strata-$VERSION.zip.sha256" \
            --title "Strata $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --target "$SHA" "${prerelease[@]}"

      # Pushed with the deploy key, like the version commit. The verify job already installed this cask from the same zip.
      - name: Commit the Homebrew cask
        run: |
          sha=$(awk '{print $1}' "dist/Strata-$VERSION.zip.sha256")
          scripts/render-cask.sh "$VERSION" "$sha" > Casks/strata-inspector.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/strata-inspector.rb
          git commit -qm "[Chore] Update Homebrew cask to $VERSION [skip ci]"
          # The release is already published, so say exactly how to finish by hand rather than leave Homebrew behind silently.
          if ! git push origin HEAD:main; then
            echo "::error title=Cask not pushed::v$VERSION is published but the cask still points at the old version. Run scripts/render-cask.sh $VERSION $sha > Casks/strata-inspector.rb on main and merge it."
            exit 1
          fi
          echo "::notice title=Cask::Casks/strata-inspector.rb now points at v$VERSION"
