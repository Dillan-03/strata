name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (must match MARKETING_VERSION)"
        required: true
      publish:
        description: "Publish a GitHub Release for the existing tag v<version> (otherwise a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  build:
    name: Build and sign
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          declared=$(grep -E '^\s+MARKETING_VERSION:' App/project.yml | head -1 | awk '{print $2}')
          case "$GITHUB_EVENT_NAME" in
            push) version="${GITHUB_REF_NAME#v}"; publish=true ;;
            workflow_dispatch) version="$INPUT_VERSION"; publish="$INPUT_PUBLISH" ;;
            *) version="$declared"; publish=false ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'"
            exit 1
          fi
          if [ "$declared" != "$version" ]; then
            echo "::error::App/project.yml declares MARKETING_VERSION $declared, not $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release commit
        id: verify
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main --tags
          tagged=$(git rev-list -n 1 "v$VERSION" 2>/dev/null || true)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag v$VERSION must exist and point at the commit being built ($GITHUB_SHA)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA isn't on main. Only tag commits that have been merged."
            exit 1
          fi

      - name: Select Xcode
        id: xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        id: xcodegen
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Release tests
        id: tests
        run: |
          set -o pipefail
          swift test --package-path Packages/StrataCore
          (cd App && xcodegen generate --quiet)
          xcodebuild test -project App/Strata.xcodeproj -scheme Strata -destination 'platform=macOS' -only-testing:StrataTests -quiet

      - name: Build Release
        id: build
        run: scripts/build-release.sh

      - name: Sign and notarise
        id: sign
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: scripts/sign-and-notarize.sh

      - name: Package
        id: package
        run: |
          scripts/package-release.sh "${{ steps.version.outputs.version }}"
          cp build/Release/signing-status dist/signing-status

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # Step logs can't be read through the checks API, so name the failed step in an annotation.
      - name: Report failed step
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "$STEPS" | python3 -c '
          import json, sys
          for name, step in json.load(sys.stdin).items():
              if step["outcome"] == "failure":
                  print(f"::error title=Release step failed::{name}")
          '

  verify:
    name: Verify install (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest hosted macOS images: 15 is the app's minimum.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Checksum and signature
        run: |
          (cd dist && shasum -a 256 -c "Strata-$VERSION.zip.sha256")
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k "dist/Strata-$VERSION.zip" "$RUNNER_TEMP/app"
          codesign --verify --deep --strict "$RUNNER_TEMP/app/Strata.app"
          if [ "$(cat dist/signing-status)" = "signed" ]; then
            spctl --assess --type execute "$RUNNER_TEMP/app/Strata.app"
            echo "::notice title=Gatekeeper ($(sw_vers -productVersion))::Signed and notarised build accepted"
          fi
          echo "::notice title=Verified on macOS $(sw_vers -productVersion)::Checksum matches; codesign --verify --strict passed ($(cat dist/signing-status) build)"

      - name: Launch
        run: scripts/smoke-test-app.sh "$RUNNER_TEMP/app/Strata.app"

      - name: Homebrew install, uninstall, reinstall and zap
        run: scripts/cask-smoke-test.sh "$VERSION" "dist/Strata-$VERSION.zip"

  publish:
    name: Publish release
    needs: [build, verify]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(cat dist/signing-status)
          sha=$(awk '{print $1}' "dist/Strata-$VERSION.zip.sha256")
          {
            if [ "$status" = "signed" ]; then
              echo "Signed with a Developer ID certificate and notarised by Apple."
            else
              echo "> [!WARNING]"
              echo "> **Unsigned build.** This release is ad-hoc signed and not notarised, so macOS Gatekeeper blocks it at first launch. After installing, run \`xattr -dr com.apple.quarantine /Applications/Strata.app\`, or right-click Strata in Finder and choose Open."
            fi
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "brew tap dillan-03/strata https://github.com/Dillan-03/verbose-octo-carnival"
            echo "brew install --cask dillan-03/strata/strata-inspector"
            echo '```'
            echo
            echo "SHA-256 of \`Strata-$VERSION.zip\`: \`$sha\`"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [ "$status" != "signed" ]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" "dist/Strata-$VERSION.zip" "dist/Strata-$VERSION.zip.sha256" \
            --title "Strata $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag "${prerelease[@]}"

      - name: Open cask update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(awk '{print $1}' "dist/Strata-$VERSION.zip.sha256")
          branch="chore/cask-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git switch -c "$branch" origin/main
          mkdir -p Casks
          scripts/render-cask.sh "$VERSION" "$sha" > Casks/strata-inspector.rb
          git add Casks/strata-inspector.rb
          git commit -m "[Chore] Update Homebrew cask to $VERSION"
          git push origin "$branch"
          # Needs "Allow GitHub Actions to create and approve pull requests" (#21). The release is already
          # published at this point, so a missing setting is a warning with a manual next step, not a failure.
          if ! gh pr create --base main --head "$branch" \
            --title "[Chore] Update Homebrew cask to $VERSION" \
            --body "Points \`Casks/strata-inspector.rb\` at the v$VERSION release (SHA-256 \`$sha\`). Opened by the Release workflow. Pull requests opened with the workflow token don't trigger CI, so close and reopen this one to run checks before merging."; then
            echo "::warning title=Cask PR not opened::Branch $branch is pushed with the updated cask, but Actions isn't allowed to open pull requests here (see #21). Open a PR from $branch to main by hand."
          fi
