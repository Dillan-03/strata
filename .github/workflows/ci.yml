name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The Release workflow runs all of CI before it builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  SWIFTLINT_IMAGE: "ghcr.io/realm/swiftlint:0.65.1"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work "$SWIFTLINT_IMAGE" swiftlint lint --strict --reporter github-actions-logging

      - name: Issue-title check tests
        run: node --test .github/scripts/issue-title.test.mjs

      - name: Version script tests
        run: python3 scripts/next-version.test.py

  core:
    name: Core (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: No third-party dependencies
        run: |
          swift package --package-path Packages/StrataCore show-dependencies --format json > deps.json
          python3 -c "import json,sys; d=json.load(open('deps.json')); sys.exit('Unexpected dependencies: ' + ', '.join(x['name'] for x in d['dependencies'])) if d['dependencies'] else print('No dependencies')"

      - name: Build
        run: swift build --package-path Packages/StrataCore -Xswiftc -warnings-as-errors

      - name: Test
        run: |
          set -o pipefail
          swift test --package-path Packages/StrataCore --enable-code-coverage 2>&1 | tee core-tests.log
          summary=$(grep -E "Executed [0-9]+ tests" core-tests.log | tail -1 | sed -E 's/^[[:space:]]+//')
          echo "::notice title=StrataCore tests (Linux)::${summary}"
          python3 .github/scripts/coverage.py "$(swift test --package-path Packages/StrataCore --show-codecov-path)"

  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # macOS runners are scarce, so a pull request that can't affect the app skips its tests.
      # Every other event tests everything.
      - name: Decide whether the app tests run
        id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=App tests::Running: every $GITHUB_EVENT_NAME run tests the app."
            exit 0
          fi
          # A pull request is checked out as a merge commit whose first parent is the base branch.
          relevant="$(git diff --name-only HEAD^1 HEAD | grep -E '^(App/|Packages/|\.github/workflows/ci\.yml$|\.github/scripts/xcresult-report\.py$)' || true)"
          if [ -n "$relevant" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=App tests::Running: this pull request changes $(wc -l <<< "$relevant" | tr -d ' ') app file(s), starting with $(head -1 <<< "$relevant")."
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=App tests::Skipped: nothing in App/, Packages/ or the app's CI changed."
          fi

  app:
    name: App (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        working-directory: App
        run: xcodegen generate

      - name: StrataCore tests (macOS)
        run: |
          set -o pipefail
          swift test --package-path Packages/StrataCore 2>&1 | tee core-tests.log
          summary=$(grep -E "Executed [0-9]+ tests" core-tests.log | tail -1 | sed -E 's/^[[:space:]]+//')
          echo "::notice title=StrataCore tests (macOS)::${summary}"

      - name: Build and test app
        run: |
          set -o pipefail
          xcodebuild test \
            -project App/Strata.xcodeproj \
            -scheme Strata \
            -destination 'platform=macOS' \
            -resultBundlePath build/TestResults.xcresult \
            -quiet

      - name: Report app test counts
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            python3 .github/scripts/xcresult-report.py build/TestResults.xcresult "App tests"
          fi

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild analyze \
            -project App/Strata.xcodeproj \
            -scheme Strata \
            -destination 'platform=macOS' \
            -quiet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    name: Dependency review
    # Needs the repository's dependency graph. Set the DEPENDENCY_REVIEW variable to "true" once it's on (see the branch protection chore).
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
